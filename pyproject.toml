[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-cctv-mesh"
version = "0.1.0"
description = "Simulation and evaluation of a self-healing CCTV mesh network"
requires-python = ">=3.11"
dependencies = [
    "networkx",
    "simpy",
    "matplotlib",
    "flask",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# The P4 acceptance suite is kept verbatim (see docs/testing.md); its short
# loop variables and unused import are not worth editing the authoritative file.
"testcase_failure.py" = ["E741", "F401"]
# The P3 and P6 acceptance suites are kept verbatim as well.
"testcase_sim.py" = ["F401", "RUF007", "B023", "BLE001"]
"testcase_dashboard.py" = ["SIM102", "SIM115", "BLE001"]

[tool.coverage.run]
source = ["src", "ui"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
