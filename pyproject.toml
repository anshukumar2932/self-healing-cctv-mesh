[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-cctv-mesh"
version = "0.1.0"
description = "Simulation and evaluation of a self-healing CCTV mesh network"
requires-python = ">=3.11"
dependencies = [
    "networkx",
    "simpy",
    "matplotlib",
    "flask",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
source = ["src", "ui"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
